# Secure Federated AI Framework Configuration

server:
  host: "0.0.0.0"
  port: 8000
  reload: true
  log_level: "info"
  workers: 1

blockchain:
  network: "Hyperledger Fabric"
  consensus: "RAFT"
  block_interval_sec: 5
  max_transactions_per_block: 200
  validator: "IBM_Z_Secure_Enclave"

federated_learning:
  model_type: "random_forest"  # random_forest, gradient_boosting, logistic
  aggregation_method: "federated_averaging"
  min_clients_per_round: 2
  max_rounds: 100
  
  # Differential Privacy
  differential_privacy:
    enabled: true
    epsilon: 1.0
    delta: 1e-5
    clip_norm: 1.0
  
  # Homomorphic Encryption
  homomorphic_encryption:
    enabled: true
    key_size: 2048
  
  # Zero-Knowledge Proofs
  zero_knowledge_proofs:
    enabled: true
    verification_required: true

model:
  # Random Forest parameters
  random_forest:
    n_estimators: 100
    max_depth: 15
    min_samples_split: 10
    min_samples_leaf: 5
    class_weight: "balanced"
    random_state: 42
  
  # Gradient Boosting parameters
  gradient_boosting:
    n_estimators: 100
    learning_rate: 0.1
    max_depth: 5
    random_state: 42
  
  # Logistic Regression parameters
  logistic_regression:
    max_iter: 1000
    class_weight: "balanced"
    random_state: 42

data:
  data_path: "data/paysim.csv"
  generate_synthetic: true
  synthetic_samples: 100000
  train_test_split: 0.2
  fraud_rate_target: 0.04

inference:
  batch_size: 1000
  max_inference_time_ms: 50
  risk_thresholds:
    high: 0.7
    medium: 0.3
    low: 0.0

security:
  # IBM Z Secure Execution
  secure_enclave:
    enabled: true
    platform: "IBM_Z_Secure_Execution"
    attestation: true
  
  # API Security
  api_security:
    rate_limiting: true
    max_requests_per_minute: 100
    require_authentication: false  # Set to true in production
  
  # Input Validation
  validation:
    max_transaction_amount: 10000000
    max_client_id_length: 100
    sanitize_inputs: true

logging:
  level: "INFO"
  log_dir: "logs"
  formats:
    console: "colored"
    file: "json"
  
  files:
    blockchain: "logs/blockchain.log"
    training: "logs/training.log"
    inference: "logs/inference.log"
    server: "logs/server.log"

monitoring:
  enabled: true
  metrics_interval_sec: 60
  performance_tracking: true
  
database:
  type: "in_memory"  # in_memory, postgresql, mongodb
  export_interval_sec: 300
  backup_path: "backups"

# Financial Institution Clients
default_clients:
  - id: "FI-001"
    name: "Bank_Alpha"
    data_size: 50000
  
  - id: "FI-002"
    name: "Bank_Beta"
    data_size: 45000
  
  - id: "FI-003"
    name: "Fintech_Gamma"
    data_size: 40000

# Feature Engineering
features:
  required:
    - "type"
    - "amount"
    - "isFraud"
  
  engineered:
    - "amount_log"
    - "balance_change_orig"
    - "balance_change_dest"
    - "orig_balance_zero"
    - "dest_balance_zero"
    - "large_transaction"
    - "dest_is_merchant"

# Deployment
deployment:
  environment: "development"  # development, staging, production
  version: "1.0.0"
  
  production:
    use_https: true
    certificate_path: "/path/to/cert.pem"
    key_path: "/path/to/key.pem"
    
  docker:
    enabled: true
    compose_file: "Docker/docker-compose.yml"